name: ci pipeline
on:  
  push: 
    branches: [main]
  
  pull_request:
    branches: [main]


env:
    app_version: 1.0.0
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: check_docker
              run: docker --version
            - name: project_name
              run: echo "ci pipeline"
            - name: check_git
              run: git --version

    check:
        if: ${{ needs.test.result == 'success' }}
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4
            - name: check docker image
              run: |
                    echo "git version is correct, proceeding to check docker image"
                          




    build: 
        runs-on: ubuntu-latest
        env: 
            app_name: my_app
        needs: test
        steps:
            - uses: actions/checkout@v4
            - name: build docker image
              run: |
                   echo docker build -t ${{ env.app_name }}:${{ env.app_version }} .


    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - name: deploy docker image
              run: |
                    echo docker run -d --name ${{ env.app_name }}_container ${{ env.app_name }}:${{ env.app_version }}
    

   