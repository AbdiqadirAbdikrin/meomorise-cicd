name: ci pipeline
on:  
  push: 
    branches: [main]
  
  pull_request:
    branches: [main]


env:
    app_version: 1.0.0
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: check_docker
              run: docker --version
            - name: project_name
              run: echo "ci pipeline"
            - name: check_git
              run: git --version





    build: 
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4
            - name: build docker image
              run: |
                    docker build -t my_app:${{ env.app_version }} .


    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - name: deploy docker image
              run: |
                    docker run -d --name my_app_container my_app:${{ env.app_version }}


