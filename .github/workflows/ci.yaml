name: ci pipeline
on:  
  push: 
    branches: [main]
  
  pull_request:
    branches: [main]


env:
    app_version: 1.0.0
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: check_docker
              run: docker --version
            - name: project_name
              run: echo "ci pipeline"
            - name: check_git
              run: git --version

    check:
        if: ${{ needs.test.result == 'success' }}
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4
            - name: check docker image
              run: |
                    echo "git version is correct, proceeding to check docker image"
                          




    build: 
        runs-on: ubuntu-latest
        env: 
            app_name: my_app
        needs: test
        steps:
            - uses: actions/checkout@v4
            - name: build docker image
              run: |
                   echo docker build -t ${{ env.app_name }}:${{ env.app_version }} .


    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - name: deploy docker image
              run: |
                    echo docker run -d --name ${{ env.app_name }}_container ${{ env.app_name }}:${{ env.app_version }}
    

                    
    prepare:
        runs-on: ubuntu-latest
        needs: deploy
        outputs:
            image_tag: ${{ steps.version.outputs.image_tag }}
        steps: 
            - name: prepare docker image
              id: version
              run: |
                    echo "tag=1.0.0" >> $GITHUB_ENV


    buildImageTag:
        runs-on: ubuntu-latest
        needs: prepare
        steps:
            - name: build docker image tag
              run: |
                   echo "building docker image with tag ${{ needs.prepare.outputs.image_tag }}"


    testMatrix:
        runs-on: ubuntu-latest
        needs: buildImageTag
        strategy:
            matrix:
                node-version: [20, 22, 24]
        steps:
            - uses: actions/checkout@v4
            - name: setup node
              run: |
                echo "setting up node version ${{ matrix.node-version}}"            